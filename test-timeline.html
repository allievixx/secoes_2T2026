<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Timeline Test</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    body { padding: 20px; background: var(--bg); color: var(--fg); }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { margin-top: 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>Timeline Test</h1>
  <div id="timeline-charts"></div>
</div>

<script>
const $ = id => document.getElementById(id);

function renderTimeline(snapshots) {
  if (!snapshots || snapshots.length < 2) {
    $("timeline-charts").innerHTML = '<div class="facts" style="color:var(--muted);padding:12px">Necessário mínimo 2 cargas para comparação temporal.</div>';
    return;
  }
  
  const d3 = globalThis.d3;
  const timeLabel = snapshot => snapshot.extractedAt
    ? new Intl.DateTimeFormat("pt-BR", { hour:"2-digit", minute:"2-digit", timeZone:"America/Sao_Paulo" }).format(new Date(snapshot.extractedAt))
    : "Único";
  
  const data = snapshots.map((snapshot, idx) => {
    const T = { n:0, el:0, ap:0 };
    if (snapshot.data.g) {
      for (const g of snapshot.data.g) {
        for (const s of g.s) {
          T.n++;
          T.el += s[1] || 0;
          T.ap += s[2] || 0;
        }
      }
    }
    return {
      time: timeLabel(snapshot),
      idx,
      sections: T.n,
      voters: T.el,
      eligible: T.ap
    };
  });
  
  const container = $("timeline-charts");
  container.innerHTML = '';
  
  const metrics = [
    { key: "sections", label: "Seções que mudam de local", color: "var(--l3)" },
    { key: "voters", label: "Eleitores nelas", color: "var(--accent)" },
    { key: "eligible", label: "Aptos", color: "var(--muted)" }
  ];
  
  for (const metric of metrics) {
    const chartDiv = document.createElement("div");
    chartDiv.className = "timeline-chart";
    
    const title = document.createElement("div");
    title.className = "timeline-title";
    title.textContent = metric.label;
    chartDiv.appendChild(title);
    
    const svg = d3.create("svg")
      .attr("viewBox", [0, 0, 700, 300])
      .attr("class", "timeline-svg");
    
    const margin = { top: 20, right: 30, bottom: 30, left: 60 };
    const width = 700 - margin.left - margin.right;
    const height = 300 - margin.top - margin.bottom;
    
    const x = d3.scaleLinear().domain([0, data.length - 1]).range([0, width]);
    const y = d3.scaleLinear().domain([0, d3.max(data, d => d[metric.key])]).range([height, 0]);
    
    const line = d3.line()
      .x((d, i) => x(i))
      .y(d => y(d[metric.key]));
    
    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);
    
    g.append("g")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x).tickFormat((d, i) => data[d] ? data[d].time : ""))
      .style("font-size", "12px");
    
    g.append("g")
      .call(d3.axisLeft(y))
      .style("font-size", "12px");
    
    g.append("path")
      .datum(data)
      .attr("fill", "none")
      .attr("stroke", metric.color)
      .attr("stroke-width", 2.5)
      .attr("d", line);
    
    g.selectAll(".dot")
      .data(data)
      .enter()
      .append("circle")
      .attr("cx", (d, i) => x(i))
      .attr("cy", d => y(d[metric.key]))
      .attr("r", 4)
      .attr("fill", metric.color)
      .attr("opacity", 0.7);
    
    chartDiv.appendChild(svg.node());
    container.appendChild(chartDiv);
  }
}

// Test data with 3 snapshots
const testSnapshots = [
  {
    extractedAt: "2026-10-19T14:00:00Z",
    data: {
      g: [
        { s: [null, 100, 50], km: 0.5, longe: false },
        { s: [null, 200, 100], km: 1.5, longe: false },
      ]
    }
  },
  {
    extractedAt: "2026-10-19T15:30:00Z",
    data: {
      g: [
        { s: [null, 120, 60], km: 0.5, longe: false },
        { s: [null, 210, 105], km: 1.5, longe: false },
      ]
    }
  },
  {
    extractedAt: "2026-10-19T16:45:00Z",
    data: {
      g: [
        { s: [null, 140, 70], km: 0.5, longe: false },
        { s: [null, 220, 110], km: 1.5, longe: false },
      ]
    }
  }
];

renderTimeline(testSnapshots);
</script>
</body>
</html>
