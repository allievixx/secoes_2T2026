name: Deploy da rotina

# Publica a imagem da rotina no Artifact Registry e troca a do Cloud Run Job "secoes".
# Produção só sai à mão: escolha o commit (vazio = topo da main), que serve também para voltar atrás.
# A infra (Job, Scheduler, segredos, contas) é aplicada à mão: infra/README.md.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit a publicar (vazio = topo da main)"
        type: string
        default: ""
      executar:
        description: "Rodar a rotina uma vez depois do deploy (publica o JSON no bucket)"
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: thech-against-bozo
  REGION: us-central1
  JOB: secoes
  WIF_PROVIDER: projects/516156654361/locations/global/workloadIdentityPools/github/providers/secoes
  CONTA_DEPLOY: secoes-deployer@thech-against-bozo.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTA_DEPLOY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build e push da imagem
        id: imagem
        run: |
          imagem="${REGION}-docker.pkg.dev/${PROJECT_ID}/${JOB}/${JOB}:$(git rev-parse HEAD)"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$imagem" .
          docker push "$imagem"
          echo "ref=$imagem" >> "$GITHUB_OUTPUT"

      - name: Atualizar a imagem do Job
        env:
          IMAGEM: ${{ steps.imagem.outputs.ref }}
        run: gcloud run jobs update "$JOB" --region="$REGION" --image="$IMAGEM" --quiet

      # Saída diferente de zero deixa o deploy vermelho; a imagem nova continua no Job.
      - name: Executar a rotina e conferir
        if: inputs.executar
        run: |
          if gcloud run jobs execute "$JOB" --region="$REGION" --wait; then
            echo "::notice::$JOB rodou com sucesso com o commit $(git rev-parse --short HEAD)."
          else
            echo "::error::$JOB falhou. Logs: https://console.cloud.google.com/run/jobs/details/${REGION}/${JOB}/logs?project=${PROJECT_ID}"
            exit 1
          fi
